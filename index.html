<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jackonomics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --rep: #dc2626;
            --dem: #1d4ed8;
            --rep-bg: #fef2f2;
            --dem-bg: #eff6ff;
            --ink: #111827;
            --ink-2: #6b7280;
            --rule: #e5e7eb;
            --bg: #ffffff;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        /* ── STICKY HEADER ───────────────────────────────── */

        .topbar {
            position: sticky;
            top: 0;
            z-index: 200;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--rule);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 0 32px;
            height: 52px;
        }

        .topbar-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--ink);
            letter-spacing: -0.01em;
            white-space: nowrap;
        }

        .topbar-meta {
            font-size: 12px;
            color: var(--ink-2);
            white-space: nowrap;
        }

        /* ── PAGE BODY ───────────────────────────────────── */

        .page {
            max-width: 960px;
            margin: 0 auto;
            padding: 64px 32px 96px;
        }

        .hero-title {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--ink);
            margin-bottom: 8px;
        }

        .hero-sub {
            font-size: 15px;
            color: var(--ink-2);
            margin-bottom: 48px;
        }

        /* ── FORECAST CARDS ──────────────────────────────── */

        .forecasts {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 48px;
        }

        .forecast-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 20px 24px;
            border: 1px solid var(--rule);
            border-radius: 8px;
            text-decoration: none;
            color: var(--ink);
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .forecast-card:hover {
            border-color: #9ca3af;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .card-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--ink-2);
            margin-bottom: 4px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .card-arrow {
            font-size: 20px;
            color: var(--ink-2);
            flex-shrink: 0;
        }

        /* ── NOTICE ──────────────────────────────────────── */

        .notice {
            font-size: 14px;
            color: var(--ink-2);
            border-top: 1px solid var(--rule);
            padding-top: 24px;
            margin-bottom: 48px;
        }

        /* ── FOOTER ──────────────────────────────────────── */

        .footer {
            font-size: 12px;
            color: var(--ink-2);
        }

        .footer a {
            color: var(--rep);
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header class="topbar">
        <span class="topbar-title">Jack's forecasts</span>
    </header>

    <main class="page">
        <h1 class="hero-title">2026 Forecasts</h1>
        <p class="hero-sub">Data-driven election forecasts by Jack Whitcomb.</p>

        <div class="forecasts">
            <a href="https://jacksforecasts.com/senate2026" class="forecast-card">
                <div>
                    <div class="card-label">2026 Midterms</div>
                    <div class="card-title">Senate Forecast</div>
                </div>
                <span class="card-arrow">→</span>
            </a>

            <a href="https://jacksforecasts.com/house2026" class="forecast-card">
                <div>
                    <div class="card-label">2026 Midterms</div>
                    <div class="card-title">House Forecast</div>
                </div>
                <span class="card-arrow">→</span>
            </a>
        </div>

        <p class="notice">This site is in development. There will eventually be more…</p>

        <div class="footer">
            <p>Created by Jack Whitcomb with Claude Code &nbsp;|&nbsp; <a href="mailto:jcwhitco0723@gmail.com">jcwhitco0723@gmail.com</a></p>
        </div>
    </main>
</body>
</html>
